server:
    port: 8888

spring:
    cloud:
        config:
            server:
                 git:
                    uri: ${CONFIG_REPOSITORY_URI}
    application:
         name: config-server

management:
    security:
        enabled: false


eureka:         #tells about the Eureka server details and its refresh time
    client:
        serviceUrl:
            defaultZone: http://localhost:8091/eureka/
        healthcheck:
            enabled: true
