server:
  port: 8008

spring:
  data:
   neo4j:
     uri : ${NEO4J_URI:bolt://localhost:7687}
     username: neo4j
     password: ${NEO4J_PASSWORD}


eureka:
  instance:
    leaseRenewalIntervalInSeconds: 1
    leaseExpirationDurationInSeconds: 1
  client:
    serviceUrl:
      defaultZone: http://localhost:8091/eureka/
    healthcheck:
      enabled: true
    lease:
      duration: 5
